<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img" aria-labelledby="t d"><title id="t">Yashraj Ayaskanta Garnayak, Cloud and DevOps</title><desc id="d">Animated header banner: a slowly drifting gradient and a small network of connected nodes behind the name and the line Cloud and DevOps, M.Sc. High Integrity Systems at Frankfurt UAS.</desc><style>svg{--e:cubic-bezier(.4,0,.2,1)}text{font-family:ui-sans-serif,-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}.dot{opacity:0}.st{opacity:0}@keyframes spin{to{transform:rotate(360deg)}}.sp{transform-box:fill-box;transform-origin:center;animation:spin .9s linear infinite}@keyframes d1{to{transform:translate(60px,26px)}}@keyframes d2{to{transform:translate(-70px,-20px)}}@keyframes net{to{transform:translate(-6px,7px)}}@keyframes tw{from{opacity:.45}to{opacity:1}}@keyframes pk{to{transform:translate(var(--dx),var(--dy))}}.g1{animation:d1 17s ease-in-out infinite alternate}.g2{animation:d2 21s ease-in-out infinite alternate}.net{animation:net 9s ease-in-out infinite alternate}.n{animation:tw 3s ease-in-out infinite alternate}.pk{animation:pk 3.4s ease-in-out infinite alternate}@media (prefers-reduced-motion:reduce){*{animation:none!important}.st{opacity:1!important}}</style><rect width="900" height="200" rx="16" fill="#0F172A" stroke="#475569" stroke-width="2"/><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0F172A"/><stop offset="1" stop-color="#1E293B"/></linearGradient><radialGradient id="a"><stop offset="0" stop-color="#38BDF8" stop-opacity=".30"/><stop offset="1" stop-color="#38BDF8" stop-opacity="0"/></radialGradient><radialGradient id="c"><stop offset="0" stop-color="#A78BFA" stop-opacity=".28"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></radialGradient><clipPath id="r"><rect width="900" height="200" rx="16"/></clipPath></defs><g clip-path="url